# Local checks for every commit. Install once per clone: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5120"]
        exclude: ^(?!board/)|^board/.*(?:\.kicad_pcb$)
      # A KiCad board is one text file that grows with its copper: the placed T1
      # main board is 4.7 MB before routing, and pours and tracks add to it. Board
      # files get 40 MB, under GitHub's 50 MB push warning; every other file keeps
      # the 5 MB limit above.
      - id: check-added-large-files
        name: check for added large files (KiCad boards, 40 MB)
        args: ["--maxkb=40960"]
        files: ^board/.*(?:\.kicad_pcb$)
      - id: check-added-large-files
        args: ["--maxkb=5120"]
        exclude: ^(?!(?:case|faceplates/cassette|faceplates/classic|faceplates/touch|product)/)
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/opendap-project/tools
    rev: v0.1.1
    hooks:
      - id: no-stray-files
      - id: kicad-erc
        exclude: ^(?!(?:board|faceplates/cassette|faceplates/classic|faceplates/touch)/)
      - id: kicad-drc
        exclude: ^(?!board/)|^board/hardware/rules/test/  # the rule test board fails by design
      - id: no-fab-outputs
        exclude: ^(?!(?:board|faceplates/cassette|faceplates/classic|faceplates/touch)/)
      - id: kicad-dru-composed
        exclude: ^(?!board/)
      - id: kicad-drc
        exclude: ^(?!(?:faceplates/cassette|faceplates/classic|faceplates/touch)/)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
