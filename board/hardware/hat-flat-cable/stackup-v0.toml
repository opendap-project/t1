# OpenDAP T1 HAT flat cable: stack-up v0 (machine-readable).
#
# Written 2026-10-24 for the board's
# docs/specs/hat-flat-cable.md (BRD-013). Every thickness and Dk is
# The fab's published standard 4-layer FPC stack-up (Stack-up for FPC page, fetched 2026-10-24)
# or a stated assumption: the adhesive and bonding-sheet Dk (3.5) and the etch are not published.
# Pairs on L2 between the L1 and L4 ground planes; L3 is voided under the pair band (cutout_um).
# Updated 2026-10-25 (hat-standard interface v2, RFC 0014, RFC 0015): the cable carries one USB
# port, so only the 90 ohm class remains; the 100 ohm extension and 50 ohm I2S classes are removed.
# Checked with toolkit-hardware's `odapkit stackup check hardware/hat-flat-cable/stackup-v0.toml`;
# format in toolkit-hardware docs/specs/stackup-method.md.

version = 1
name = "t1 HAT flat cable stack-up v0"
build = "4-layer FPC, adhesive-based polyimide cores"
material = "The fab's standard 4-layer FPC stack-up, 0.268 mm (Stack-up for FPC page, fetched 2026-10-24)"
design_window_pct = 2.0

[etch]
outer_reduction_um = 6.0
inner_reduction_um = 4.0

[tolerance]
dielectric_pct = 10
er_pct = 5
width_um = 10
copper_pct = 15

[thickness]
min_mm = 0.25
max_mm = 0.32
tolerance_mm = 0.03
source = "Fab: ±1.2 mil for multilayer flex up to 12 mil [P5]"

[[layer]]
name = "Coverlay top"
type = "mask"
thickness_um = 27.5
er = 3.4
material = "PI 12.5 (Dk 3.3) + adhesive 15 (Dk 3.5 assumed); mean"

[[layer]]
name = "L1"
type = "copper"
thickness_um = 24
role = "ground plane"
material = "18 um base, 24 um finished"

[[layer]]
name = "Adh L1"
type = "dielectric"
thickness_um = 13
er = 3.5
material = "adhesive, Dk assumed"

[[layer]]
name = "PI L1-L2"
type = "dielectric"
thickness_um = 25
er = 3.3
material = "polyimide"

[[layer]]
name = "Gum L2"
type = "dielectric"
thickness_um = 13
er = 3.5
material = "bonding sheet, Dk assumed"

[[layer]]
name = "L2"
type = "copper"
thickness_um = 12
role = "signal"
material = "12 um"
fills = "above"

[[layer]]
name = "Adh L2"
type = "dielectric"
thickness_um = 13
er = 3.5
material = "adhesive"

[[layer]]
name = "PI L2-L3"
type = "dielectric"
thickness_um = 25
er = 3.3
material = "polyimide"

[[layer]]
name = "Adh L3"
type = "dielectric"
thickness_um = 13
er = 3.5
material = "adhesive"

[[layer]]
name = "L3"
type = "copper"
thickness_um = 12
role = "power pours, void under the pair band"
material = "12 um"
fills = "below"

[[layer]]
name = "Gum L3"
type = "dielectric"
thickness_um = 13
er = 3.5
material = "bonding sheet"

[[layer]]
name = "PI L3-L4"
type = "dielectric"
thickness_um = 25
er = 3.3
material = "polyimide"

[[layer]]
name = "Adh L4"
type = "dielectric"
thickness_um = 13
er = 3.5
material = "adhesive"

[[layer]]
name = "L4"
type = "copper"
thickness_um = 24
role = "ground plane"
material = "18 um base, 24 um finished"

[[layer]]
name = "Coverlay bottom"
type = "mask"
thickness_um = 27.5
er = 3.4
material = "adhesive 15 + PI 12.5; mean"

[[class]]
name = "D90-L2"
netclasses = ["USB3_90D", "USB2_90D"]
type = "diff"
target_ohm = 90
tolerance_pct = 10
layer = "L2"
reference = ["L1", "L4"]
solve = "width"
gap_um = 100
width_um = 72.5
z_ohm = 89.89
cutout_um = 3000
