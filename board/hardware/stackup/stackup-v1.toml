# OpenDAP T1 main board: stackup v1 (machine-readable).
#
# SUPERSEDED 2026-10-25 by stackup-v2.toml (docs/specs/stackup-v2.md); kept as the record.
#
# Accepted 2026-10-24. Explained in
# docs/specs/stackup-v1.md. To be confirmed by the fab's DFM review (deferred):
# every thickness, copper weight and Dk here is the fab's published data or a stated assumption.
# Checked with toolkit-hardware's `odapkit stackup check hardware/stackup/stackup-v1.toml`;
# format in toolkit-hardware docs/specs/stackup-method.md.
#
# 2026-10-25 (RFC 0014, HATs are USB only): the net classes PCIE_85D, PCIE_REFCLK_100D and
# HAT_EXT_100D are withdrawn from the board (hardware/rules/netclasses.toml). The D85 classes and
# those names in the D100 classes stay as solved and match no net; the stack is unchanged.
#
# Layers top (front, faceplate side, +z) to bottom (back, battery side). Thicknesses in µm:
# dielectrics as pressed (copper surface to copper surface), copper as finished.

version = 1
name = "t1-main-board stackup v1"
build = "HDI 2+6+2, 10 layers, stacked copper-filled microvias L1-L2-L3 and L10-L9-L8, through vias L1-L10"
material = "FR-4 Tg 170 (the fab offers Shengyi S1000-2M); Dk values are the fab's published stack-up table values, frequency not stated"
design_window_pct = 2.0

[etch]
# Trapezoidal etch: the top of a trace is narrower than the drawn width. ASSUMPTION
# (typical values, not published by the fab); the solver uses the mean width.
outer_reduction_um = 10.0
inner_reduction_um = 6.0

[tolerance]
# Fab corners for the sensitivity report. dielectric_pct is the fab's laminate thickness class
# (assumption: their published board tolerance is ±10 %); er, width and copper are ASSUMPTIONS.
dielectric_pct = 10
er_pct = 5
width_um = 10
copper_pct = 15

[thickness]
# PCB-S-01: 1.0-1.2 mm (ADR 0016 z budget). Nominal + the fab's ±0.10 mm (T <= 1.0 mm row,
# assumed to extend to 1.1 mm) must stay within 1.2 mm.
min_mm = 1.0
max_mm = 1.2
tolerance_mm = 0.1
source = "PCB-S-01; fab thickness tolerance [P1]"

[[distance]]
# PCB-R-03: Murata asks for 230-240 µm between the RF trace and its ground (E2B-09-1413 §3.5.1).
from = "L1"
to = "L3"
min_um = 230
max_um = 240
source = "PCB-R-03 (RF microstrip on L1 over a local L3 ground, L2 cut out)"

[[distance]]
from = "L10"
to = "L8"
min_um = 230
max_um = 240
source = "PCB-R-03 (RF microstrip on L10 over a local L8 ground, L9 cut out)"

[[layer]]
name = "Mask top"
type = "mask"
thickness_um = 20
er = 3.8
material = "LPI solder mask, thickness and Dk ASSUMED (not published by the fab)"

[[layer]]
name = "L1"
type = "copper"
thickness_um = 35
role = "signal (front: microstrip, parts, SoC decoupling, FH35C)"
material = "18 µm base plated (fab: 0.5 oz plated to 1 oz)"

[[layer]]
name = "PP L1-L2"
type = "dielectric"
thickness_um = 90
er = 4.45
material = "prepreg 3313 RC58% (the fab Dk 4.45; 103 µm before pressing), laser-drillable"

[[layer]]
name = "L2"
type = "copper"
thickness_um = 25
role = "ground (plane)"
material = "12 µm base plated in the L2-L3 laser step (ASSUMED 25 µm)"

[[layer]]
name = "PP L2-L3"
type = "dielectric"
thickness_um = 120
er = 4.45
material = "prepreg 2116 RC58% (the fab Dk 4.45; 130 µm before pressing)"

[[layer]]
name = "L3"
type = "copper"
thickness_um = 18
role = "signal (stripline)"
material = "18 µm base, unplated (no buried vias)"
fills = "above"

[[layer]]
name = "Core L3-L4"
type = "dielectric"
thickness_um = 103
er = 4.6
material = "core (the fab Dk 4.6; 103 µm dielectric)"

[[layer]]
name = "L4"
type = "copper"
thickness_um = 18
role = "ground (plane)"
material = "18 µm"

[[layer]]
name = "PP L4-L5"
type = "dielectric"
thickness_um = 65
er = 4.21
material = "prepreg 1080 RC68% (the fab Dk 4.21), thin plane pair"

[[layer]]
name = "L5"
type = "copper"
thickness_um = 18
role = "power (SoC core and LPDDR4X rails)"
material = "18 µm"

[[layer]]
name = "Core L5-L6"
type = "dielectric"
thickness_um = 50
er = 4.6
material = "core 50 µm (the fab minimum dielectric for impedance stack-ups [P12]; the fab core Dk 4.6), power-power, no impedance class references it"

[[layer]]
name = "L6"
type = "copper"
thickness_um = 18
role = "power (system and audio rails, battery pours)"
material = "18 µm"

[[layer]]
name = "PP L6-L7"
type = "dielectric"
thickness_um = 65
er = 4.21
material = "prepreg 1080 RC68% (the fab Dk 4.21), thin plane pair"

[[layer]]
name = "L7"
type = "copper"
thickness_um = 18
role = "ground (plane)"
material = "18 µm"

[[layer]]
name = "Core L7-L8"
type = "dielectric"
thickness_um = 103
er = 4.6
material = "core (the fab Dk 4.6; 103 µm dielectric)"

[[layer]]
name = "L8"
type = "copper"
thickness_um = 18
role = "signal (stripline)"
material = "18 µm base, unplated (no buried vias)"
fills = "below"

[[layer]]
name = "PP L8-L9"
type = "dielectric"
thickness_um = 120
er = 4.45
material = "prepreg 2116 RC58% (the fab Dk 4.45)"

[[layer]]
name = "L9"
type = "copper"
thickness_um = 25
role = "ground (plane)"
material = "12 µm base plated in the L9-L8 laser step (ASSUMED 25 µm)"

[[layer]]
name = "PP L9-L10"
type = "dielectric"
thickness_um = 90
er = 4.45
material = "prepreg 3313 RC58% (the fab Dk 4.45), laser-drillable"

[[layer]]
name = "L10"
type = "copper"
thickness_um = 35
role = "signal (back: SoC, LPDDR4X, eMMC, microstrip)"
material = "18 µm base plated"

[[layer]]
name = "Mask bottom"
type = "mask"
thickness_um = 20
er = 3.8
material = "LPI solder mask, ASSUMED"

[[class]]
name = "SE50-L1"
netclasses = ["DDR_50SE", "EMMC_SD_50SE", "I2S_50SE"]
type = "se"
target_ohm = 50
tolerance_pct = 10
layer = "L1"
reference = ["L2"]
solve = "width"
constraints = "PCB-I-05, I-06, I-08"
width_um = 134.5
z_ohm = 50.02

