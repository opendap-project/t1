# OpenDAP T1 main board: stackup v2 (machine-readable).
#
# SUPERSEDED 2026-10-25 by stackup-v3.toml (docs/specs/stackup-v3.md); kept as the record.
#
# Accepted 2026-10-25. Basis: the zoned layer-count
# exploration (`odapkit stackup explore explore-zoned.toml`: rank 2 overall and the only
# eight-layer candidate with one full-layer ground; the six-layer rank 1 fails the SoC plane
# check, docs/specs/stackup-v2.md §0). Explained in docs/specs/stackup-v2.md; replaces stackup v1
# (ten layers). To be confirmed by the fab's DFM review: every thickness, copper weight and Dk
# here is the fab's published data or a stated assumption. Checked with toolkit-hardware's
# `odapkit stackup check hardware/stackup/stackup-v2.toml`; format in toolkit-hardware
# docs/specs/stackup-method.md.
#
# Layers top (front, faceplate side, +z) to bottom (back, battery side, the SoC). Thicknesses in
# µm: dielectrics as pressed, copper as finished. Roles vary by zone (docs/specs/floorplan-v1.md
# §3); the role below is the layer's role where impedance classes route.

version = 1
name = "t1-main-board stackup v2"
build = "HDI 2+4+2, 8 layers, stacked copper-filled microvias L1-L2-L3 and L8-L7-L6, through vias L1-L8"
material = "FR-4 Tg 170 (the fab offers Shengyi S1000-2M); Dk values are the fab's published stack-up table values, frequency not stated"
design_window_pct = 2.0

[etch]
# Trapezoidal etch: the top of a trace is narrower than the drawn width. ASSUMPTION
# (typical values, not published by the fab); the solver uses the mean width.
outer_reduction_um = 10.0
inner_reduction_um = 6.0

[tolerance]
# Fab corners for the sensitivity report (ASSUMPTIONS, as stackup v1).
dielectric_pct = 10
er_pct = 5
width_um = 10
copper_pct = 15

[thickness]
# PCB-S-01: 1.0-1.2 mm (ADR 0016). Nominal + the fab's ±0.10 mm within 1.2 mm.
min_mm = 1.0
max_mm = 1.2
tolerance_mm = 0.1
source = "PCB-S-01; fab thickness tolerance [P1]"

[[distance]]
# PCB-R-03: Murata asks for 230-240 µm between the RF trace and its ground (E2B-09-1413 §3.5.1).
from = "L1"
to = "L3"
min_um = 230
max_um = 240
source = "PCB-R-03 (RF microstrip on L1 over the L3 ground, L2 cut out)"

[[distance]]
from = "L8"
to = "L6"
min_um = 230
max_um = 240
source = "PCB-R-03 (RF microstrip on L8 over the radio zone's L6 ground, L7 cut out)"

[[distance]]
# PCB-S-12 (constraints v0.14): the SoC core and LPDDR4X rails' plane on L4 paired with the L5
# ground across a laser-class prepreg of at most 90 µm.
from = "L4"
to = "L5"
min_um = 0
max_um = 90
source = "PCB-S-12"

[[layer]]
name = "Mask top"
type = "mask"
thickness_um = 20
er = 3.8
material = "LPI solder mask, thickness and Dk ASSUMED (not published by the fab)"

[[layer]]
name = "L1"
type = "copper"
thickness_um = 35
role = "signal: front parts, decoupling, microstrip over L2, RF option over L3"
material = "18 µm base plated (the fab: 0.5 oz plated to 1 oz)"

[[layer]]
name = "PP L1-L2"
type = "dielectric"
thickness_um = 90
er = 4.45
material = "prepreg 3313 RC58% (the fab's Dk 4.45), laser-drillable"

[[layer]]
name = "L2"
type = "copper"
thickness_um = 25
role = "ground in every zone but the core (system-rail plane there); L1's reference"
material = "12 µm base plated in the L2-L3 laser step (ASSUMED 25 µm)"

[[layer]]
name = "PP L2-L3"
type = "dielectric"
thickness_um = 120
er = 4.45
material = "prepreg 2116 RC58% (the fab's Dk 4.45), laser-drillable"

[[layer]]
name = "L3"
type = "copper"
thickness_um = 18
role = "ground in every zone but the power zone (pours there); the RF ground under an L1 line"
material = "18 µm"

[[layer]]
name = "Core L3-L4"
type = "dielectric"
thickness_um = 130
er = 4.6
material = "core 0.13 mm [PW-ST] (the fab's core Dk 4.6), read as dielectric thickness (UNVERIFIED: the table lists cores with copper)"

[[layer]]
name = "L4"
type = "copper"
thickness_um = 18
role = "power by zone: SoC core and LPDDR4X rails (core), audio rails (audio), HAT and USB VBUS pours (I/O), battery and VSYS pours (power)"
material = "18 µm"

[[layer]]
name = "PP L4-L5"
type = "dielectric"
thickness_um = 90
er = 4.45
material = "prepreg 3313 RC58% (the fab's Dk 4.45), the core-rail plane pair (PCB-S-12)"

[[layer]]
name = "L5"
type = "copper"
thickness_um = 18
role = "ground in every zone but the power zone (pours there); L6's upper reference"
material = "18 µm"

[[layer]]
name = "Core L5-L6"
type = "dielectric"
thickness_um = 130
er = 4.6
material = "core 0.13 mm [PW-ST] (the fab's core Dk 4.6), read as dielectric thickness (UNVERIFIED)"

[[layer]]
name = "L6"
type = "copper"
thickness_um = 18
role = "stripline (L5/L7): SoC escape, LPDDR4X, eMMC, fast I/O, MCLK; ground in the radio zone; pours in the power zone"
fills = "below"
material = "18 µm base, unplated"

[[layer]]
name = "PP L6-L7"
type = "dielectric"
thickness_um = 120
er = 4.45
material = "prepreg 2116 RC58% (the fab's Dk 4.45), laser-drillable"

[[layer]]
name = "L7"
type = "copper"
thickness_um = 25
role = "ground, full layer (L8's and L6's reference)"
material = "12 µm base plated in the L7-L6 laser step (ASSUMED 25 µm)"

[[layer]]
name = "PP L7-L8"
type = "dielectric"
thickness_um = 90
er = 4.45
material = "prepreg 3313 RC58% (the fab's Dk 4.45), laser-drillable"

[[layer]]
name = "L8"
type = "copper"
thickness_um = 35
role = "signal: RK3566, LPDDR4X, eMMC, microstrip over L7, RF option over L6"
material = "18 µm base plated"

[[layer]]
name = "Mask bottom"
type = "mask"
thickness_um = 20
er = 3.8
material = "LPI solder mask, ASSUMED"

[[class]]
name = "SE50-L1"
netclasses = ["DDR_50SE", "EMMC_SD_50SE", "I2S_50SE"]
type = "se"
target_ohm = 50
tolerance_pct = 10
layer = "L1"
reference = ["L2"]
solve = "width"
constraints = "PCB-I-05, I-06, I-08"
width_um = 134.5
z_ohm = 50.02

[[class]]
name = "D90-L1"
netclasses = ["USB2_90D", "USB3_90D"]
type = "diff"
target_ohm = 90
tolerance_pct = 10
layer = "L1"
reference = ["L2"]
solve = "width"
gap_um = 100
constraints = "PCB-I-01, I-02"
width_um = 101.5
z_ohm = 89.99

[[class]]
name = "D100-L1"
netclasses = ["MIPI_100D", "DDR_100D"]
type = "diff"
target_ohm = 100
tolerance_pct = 10
layer = "L1"
reference = ["L2"]
solve = "width"
gap_um = 175
constraints = "PCB-I-04, I-05"
width_um = 104.5
z_ohm = 100.0

[[class]]
name = "SE50-L8"
netclasses = ["DDR_50SE", "EMMC_SD_50SE", "I2S_50SE"]
type = "se"
target_ohm = 50
tolerance_pct = 10
layer = "L8"
reference = ["L7"]
solve = "width"
constraints = "PCB-I-05, I-06, I-08"
width_um = 134.5
z_ohm = 50.02

[[class]]
name = "D90-L8"
netclasses = ["USB2_90D", "USB3_90D"]
type = "diff"
target_ohm = 90
tolerance_pct = 10
layer = "L8"
reference = ["L7"]
solve = "width"
gap_um = 100
constraints = "PCB-I-01, I-02"
width_um = 101.5
z_ohm = 89.99

[[class]]
name = "D100-L8"
netclasses = ["MIPI_100D", "DDR_100D"]
type = "diff"
target_ohm = 100
tolerance_pct = 10
layer = "L8"
reference = ["L7"]
solve = "width"
gap_um = 175
constraints = "PCB-I-04, I-05"
width_um = 104.5
z_ohm = 100.0

[[class]]
name = "SE50-L6"
netclasses = ["DDR_50SE", "EMMC_SD_50SE", "I2S_50SE", "MCLK_50SE"]
type = "se"
target_ohm = 50
tolerance_pct = 10
layer = "L6"
reference = ["L5", "L7"]
solve = "width"
constraints = "PCB-I-05, I-06, I-08, I-09"
width_um = 90.5
z_ohm = 50.01

[[class]]
name = "D90-L6"
netclasses = ["USB2_90D", "USB3_90D"]
type = "diff"
target_ohm = 90
tolerance_pct = 10
layer = "L6"
reference = ["L5", "L7"]
solve = "width"
gap_um = 150
constraints = "PCB-I-01, I-02"
width_um = 95.5
z_ohm = 90.06

[[class]]
name = "D100-L6"
netclasses = ["MIPI_100D", "DDR_100D"]
type = "diff"
target_ohm = 100
tolerance_pct = 10
layer = "L6"
reference = ["L5", "L7"]
solve = "width"
gap_um = 250
constraints = "PCB-I-04, I-05"
width_um = 85.5
z_ohm = 99.92

[[class]]
name = "RF50-L1"
netclasses = ["RF_50SE"]
type = "se"
target_ohm = 50
tolerance_pct = 10
layer = "L1"
reference = ["L3"]
solve = "width"
cutout_um = 1600            # L2 cut out 1.6 mm wide under the line
coplanar_gap_um = 600       # same-layer ground pour kept 0.6 mm from the line edges
constraints = "PCB-I-07, PCB-R-03"
width_um = 391.0
z_ohm = 50.0

[[class]]
name = "RF50-L8"
netclasses = ["RF_50SE"]
type = "se"
target_ohm = 50
tolerance_pct = 10
layer = "L8"
reference = ["L6"]
solve = "width"
cutout_um = 1600            # L7 cut out 1.6 mm wide under the line
coplanar_gap_um = 600       # same-layer ground pour kept 0.6 mm from the line edges
constraints = "PCB-I-07, PCB-R-03"
width_um = 391.0
z_ohm = 50.0
