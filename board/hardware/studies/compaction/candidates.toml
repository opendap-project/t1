# Compaction study of the T1 main board (2026-10-27): the candidates and the design stresses the
# matrix tool (compaction.py) checks. Every value cites its source. The sourcing check (T1-029) is
# run with `odapkit parts matrix` and kept privately; its outcome per candidate is `sourcing`.

[rules]
# BRD-049 margins as the power tree v0 §4.10 applies them to every inductor: the design peak at
# most 70 % of Isat (30 % drop), the converter's maximum current limit at most 100 % of it.
inductor_peak_max = 0.70
inductor_limit_max = 1.00
# Ceramic capacitors: rated at least twice the rail (the sheets' "unless noted" rule, CRAFT-115).
mlcc_rating_min = 2.0
# Heights: PCB-Z-03 front under the display, PCB-Z-01 back under the pocket (ADR 0016).
h_front = 1.0
h_back = 1.5
# Test pads (PCB-D-06, [JD]): absolute minimum 0.8 mm on signal nets, 1.0 mm on power and ground
# nets.
tp_signal_min = 0.8
tp_power_min = 1.0

