# Shield-can frames of the T1 main board (blk.shields; BOM v1 line 90; placement v1 decision 15).
#
# Two-piece cans etched to the board's outline (amended T1-038: made-to-order parts a small project
# can obtain): a frame soldered to its land and a lid that clips over it. The generator draws each
# frame's land from this file (footprint Shield_Frame_<ID> in hardware/lib) and the placement tool
# reserves it; both read it through pcb/shields.py.
#
# A frame is given by the area its parts may use inside (`inside`, device frame of PCB-M-04: origin
# at the board centre, +y towards the top wall, mm). The land stands `keepout_in` outside that,
# `land` wide, and the land's courtyard reaches `keepout` beyond its outer edge. Parts under the lid are at
# most height - lid - clearance tall.

[defaults]
side = "B"                     # PCB-Z-03: no shield cans under the display (front); the back pocket takes them
height = 1.5                   # frame with lid: the PCB-Z-01 limit, can and thermal pad included
lid = 0.1                      # capture choice, UNVERIFIED until the maker's drawing
clearance = 0.1                # lid to the tallest part inside; capture choice, UNVERIFIED
land = 0.4                     # land width: the 0.2 mm etched wall with 0.1 mm of fillet each side; capture choice, UNVERIFIED until the maker's drawing
keepout = 0.5                  # PCB-T-06 frame keep-out (UNVERIFIED), outside the land: the lid's wall and its tolerance
keepout_in = 0.3               # parts inside to the frame wall; capture choice, UNVERIFIED until the maker's drawing

[[frame]]
id = "SOC"
title = "SoC and LPDDR4X"
basis = "PCB-T-06, BOM v1 line 90"
# the RK3566 (U1301) and LPDDR4X (U2101) courtyards of placement v1.5 with 0.5 mm to the left,
# bottom and right, the top edge on the LPDDR4X courtyard; the eMMC (U3801) and the RK809 (U1101,
# placement v1.6: 0.4 mm higher) stay outside
inside = [-9.3, 1.25, 23.45, 19.6]

[[frame]]
id = "RADIO"
title = "Radio module"
basis = "PCB-T-06, PCB-EMC-03, BOM v1 line 90"
# the Murata Type 2EL (U5001, 1.3 mm) with its series and matching positions; the U.FL receptacles
# (J5201, J5202) and the top wall stay outside (PCB-R-13); the RK809 stays to the right
inside = [-22.9, 27.9, -11.0, 37.6]

# No frame over the DACs and the headphone stage (placement v1 decision 16, 2026-10-28): most of the
# stage stands on the front, where PCB-Z-03 allows no can, so a back frame covered little of it.
