# OpenDAP T1 main board: variant "full"
#
# Format: opendap.board-variant/v1, defined in docs/specs/feature-blocks.md §4.
# Every block of the catalog appears exactly once under [blocks]. KiCad's
# variant data, the BOM, pick-and-place, devicetree overlays and the device
# description are generated from this file (RFC 0011 rule 7); nothing is
# edited by hand per variant.
#
# 2026-10-25 (RFC 0014, HATs are USB only): blk.hat-3v3 and blk.hat-audio
# are removed from the catalog.

schema = "opendap.board-variant/v1"
board = "t1-main-board"
name = "full"
kind = "full"
status = "proposed"
description = "Prototype 1: every block, every should part and every measurement link with its shunt value (RFC 0011 rule 1, BRD-053)."
target_level = "Q1"
catalog = "docs/specs/feature-blocks.md"
promise = ["T1-040", "BRD-049", "BRD-053"]

[instrumentation]
links = "shunt"
test_points = "fit"

[blocks]
"blk.soc" = { state = "fit" }
"blk.lpddr4x" = { state = "fit" }
"blk.emmc" = { state = "fit", params = { capacity_gb = 32 }, note = "BRD-037: 32 GB on prototypes" }
"blk.microsd" = { state = "fit" }
"blk.board-id" = { state = "fit" }
"blk.gpio-expander" = { state = "fit" }
"blk.charger" = { state = "fit" }
"blk.gauge" = { state = "fit" }
"blk.usb-c" = { state = "fit" }
"blk.pwr-vsys-lv" = { state = "fit" }
"blk.pwr-3v3-sys" = { state = "fit" }
"blk.pmic" = { state = "fit" }
"blk.vdd-cpu" = { state = "fit" }
"blk.pwr-5v1" = { state = "fit" }
"blk.hat-5v" = { state = "fit" }
"blk.usb-vbus-out" = { state = "fit" }
"blk.current-monitors" = { state = "fit", params = { shunt_mohm = { vsys = 10, audio = 100, display = 100, hat = 20 } } }
"blk.hat-signals" = { state = "fit" }
"blk.fp-connector" = { state = "fit" }
"blk.fp-display" = { state = "fit" }
"blk.fp-backlight" = { state = "fit" }
"blk.fp-controls" = { state = "fit" }
"blk.status-led" = { state = "fit" }
"blk.mic-main" = { state = "fit" }
