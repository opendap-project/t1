# Output-stage regression after ADR 0015 (TPS65131 boost only; LMR33630C for -7 V).
# tps65131-dc-load.cir defaults: worst stack, switch limit off (ilim=10).
version = 1

[[model]]
id = "lmr33630c"
manufacturer = "Texas Instruments"
mpn = "LMR33630CRNXR"
file = "SNVMBG5"                # parts-lib manifest: kind = "spice", SNVMBG5A (zip sha256 bf3d8f3b…)
member = "LMR33630C_PSPICE_TRANS/LMR33630C_TRANS.lib"
dest = "models/LMR33630C_TRANS.lib"
sha256 = "b6ca4171f65db8d9f5c70ad0f06d6da9c164d84ef134c095dd220bb47ef70906"

[[model]]
id = "opa1622"                  # used by opa1622-*.cir (no regression check yet)
manufacturer = "Texas Instruments"
mpn = "OPA1622IDRCR"
file = "SBOM958"                # parts-lib manifest: kind = "spice", SBOM958D (zip sha256 1bafa50b…)
member = "OPA1622.LIB"
dest = "models/OPA1622.LIB"
sha256 = "9dfaf17ed53e37d8930376f042379e828d96bc7d10349fed0dc058daf695223e"

[[check]]
id = "boost-peak-c-3v7"
description = "Boost switch peak at the 433 mA full-scale peak, VIN 3.7 V, worst stack"
netlist = "tps65131-dc-load.cir"
params = { vin = 3.7, iload = 0.433 }
measure = "boost_pct"
max = 80.0
unit = "% of 1.8 A"
source = "BRD-049 (continuous <= 80 %); ADR 0015; README Results"

[[check]]
id = "boost-peak-520ma-3v7"
netlist = "tps65131-dc-load.cir"
params = { vin = 3.7, iload = 0.520 }
measure = "boost_pct"
max = 80.0
unit = "% of 1.8 A"
source = "BRD-049; README Results"

[[check]]
id = "boost-ldo-trip-3v7"
description = "Boost at the positive LDO pair's maximum trip (0.65 A), worst stack"
netlist = "tps65131-dc-load.cir"
params = { vin = 3.7, iload = 0.65 }
measure = "boost_pct"
max = 100.0
unit = "% of 1.8 A"
source = "BRD-049 (limiter trip <= 100 %); ADR 0015; README Results"

[[check]]
id = "lmr-peak-c"
description = "LMR33630C inductor peak at the 433 mA peak, VSYS 6.0 V (15-25 min)"
netlist = "lmr33630-ibb.cir"
params = { vsys = 6.0, ipk = 0.433 }
measure = "hs_pct"
max = 80.0
unit = "% of 3.85 A"
source = "BRD-049; ADR 0015; README Results"
models = ["lmr33630c"]
timeout = 3600
