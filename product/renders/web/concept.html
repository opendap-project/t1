<style>
  /* Full-window product render on the studio backdrop. */
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  /* A 16:9 frame, like a 1080p video cover: fitted to the window, centred, letterboxed in black.
     The canvas always renders at 1920 × 1080 whatever the frame's on-screen size. */
  body { background: #000; overflow: hidden; display: grid; place-items: center; }
  .stage {
    position: relative; overflow: hidden;
    width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9;
    background:
      radial-gradient(ellipse 28% 42% at 57.6% 46%, rgba(170,185,205,0.13), transparent 72%),   /* light pool right behind the device */
      radial-gradient(ellipse 90% 80% at 57% 46%, #1d2125 0%, #15181b 55%, #0d0f11 100%);
  }
  #view { position: absolute; inset: 0; }
  #view canvas { display: block; outline: none; }
  .labels { display: none; }
  /* Hero overlay, sized in frame units (cqw) so it scales with the 1920 × 1080 frame like video graphics. */
  .stage { container-type: inline-size; }
  .hero { position: absolute; left: 6.5cqw; top: 4.088cqw;   /* T1 cap top sits 6cqw from the top, the same margin as the logo and the note at the bottom */ color: #f5f6f4; pointer-events: none; }
  .hero h1 { margin: 0; display: grid; gap: 1.4cqw;   /* title and subtitle as wide as the bullet list */ font: 300 4.69cqw/1 "IBM Plex Sans", system-ui, sans-serif; color: #c6cbd0; letter-spacing: -0.005em; }
  .hero h1 b { font: 600 17.87cqw/0.86 "IBM Plex Sans", system-ui, sans-serif; color: #f5f6f4; letter-spacing: -0.03em; }
  /* Optical left alignment: cancel each glyph's left side bearing (Plex Sans SemiBold "T" 0.026 em, Light "O" 0.063 em). */
  .hero h1 b { margin-left: -0.026em; }
  .hero h1 span { margin-left: -0.063em; }
  .hero h1 { padding-left: 0.104cqw; }   /* the list's ink starts ~0.09 em in (Plex Mono D/B); the title lines up with it */
  .hero ul { list-style: none; margin: 3cqw 0 0; padding: 0; display: grid; gap: 1.05cqw; font: 400 1.15cqw/1.2 "IBM Plex Mono", ui-monospace, monospace; color: #939ba3; letter-spacing: 0.01em; }   /* sentence case, no wide tracking (design system §9.2) */
  /* The first point is active by default; hovering any point makes it the active one instead. */
  .hero ul { pointer-events: auto; }
  .hero li { cursor: default; transition: color 120ms cubic-bezier(0.2, 0, 0, 1); }
  .hero li:first-child { color: #f5f6f4; }
  .hero ul:hover li:first-child { color: #939ba3; }
  .hero ul:hover li:hover, .hero ul:hover li:first-child:hover { color: #f5f6f4; }
  @media (prefers-reduced-motion: reduce) { .hero li { transition: none; } }
  /* Top right: open source, open hardware and GitHub marks, one colour, top edge on the T1 cap top, right edge on the logo's. */
  .marks { position: absolute; right: 6cqw; top: 6cqw; display: flex; align-items: center; gap: 1.5cqw; margin: 0; padding: 0; list-style: none; }
  .marks li { display: grid; place-items: center; width: 2cqw; height: 2cqw; }
  .marks svg { display: block; width: calc(2cqw * var(--k, 1)); height: calc(2cqw * var(--k, 1)); fill: #939ba3; }   /* --k: optical size per mark (Simple Icons, CC0) */
  .marks a { display: block; color: inherit; }
  .marks a:focus-visible { outline: 0.12cqw solid #ff874d; outline-offset: 0.3cqw; border-radius: 0.3cqw; }
  /* Soft contact shadow under the device: no floor, just enough to stop it floating. */
  .shadow { position: absolute; left: 57.6%; top: 84.5%; width: 22cqw; height: 2.4cqw; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,0.55), rgba(0,0,0,0.22) 55%, transparent); filter: blur(0.6cqw); pointer-events: none; }
  /* Disclaimer: aligned left with the text block and on the logo's bottom edge. */
  .disclaimer { position: absolute; left: 6.5cqw; bottom: 6cqw; margin: 0; font: 400 0.8cqw/1.6 "IBM Plex Mono", ui-monospace, monospace; color: #565e66; letter-spacing: 0.01em; pointer-events: none; }   /* dimmed by request, about 2.6:1 on this backdrop: under AA for small text (design system §3.4); fine for a video frame, not for web or docs */
  .wordmark { position: absolute; right: 6cqw; bottom: 6cqw; width: 7cqw;   /* vertical lockup: mark above the wordmark */ height: auto; display: block; pointer-events: none; }
</style>
